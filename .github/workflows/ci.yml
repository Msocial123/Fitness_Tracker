name: Fitness Tracker CI/CD

on:
push:
branches:
- master

pull_request:
branches:
- master

jobs:

build-and-analyze:
runs-on: ubuntu-latest

```
steps:

  - name: Checkout Source
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 18

  - name: Install Dependencies
    run: npm install

  - name: Build Application
    run: npm run build --if-present

  - name: SonarQube Scan
    uses: SonarSource/sonarqube-scan-action@v5
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
```

quality-gate:
needs: build-and-analyze
runs-on: ubuntu-latest

```
steps:

  - name: Check Quality Gate
    uses: SonarSource/sonarqube-quality-gate-action@master
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
```

docker-build:
needs: quality-gate

```
runs-on: ubuntu-latest

steps:

  - uses: actions/checkout@v4

  - name: Login to DockerHub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKER_PASSWORD }}

  - name: Build Docker Image
    run: |
      docker build -t harsh0soni/fitness-tracker:${{ github.run_number }} .
      docker tag harsh0soni/fitness-tracker:${{ github.run_number }} harsh0soni/fitness-tracker:latest

  - name: Push Docker Image
    run: |
      docker push harsh0soni/fitness-tracker:${{ github.run_number }}
      docker push harsh0soni/fitness-tracker:latest
```
