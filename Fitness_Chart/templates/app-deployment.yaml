apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  labels:
    app: {{ .Values.app.name }}
    {{- include "fitness-tracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
      annotations:
        ad.datadoghq.com/{{ .Values.app.name }}.logs: >-
          [{"source":"nodejs","service":"{{ .Values.app.service.name }}"},
           {"source":"nodejs","service":"{{ .Values.app.name }}"}]
    spec:
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.containerPort }}
          env:
            # Non-sensitive config from the ConfigMap
            {{- range $key := keys .Values.config }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: fitness-configmap
                  key: {{ $key }}
            {{- end }}
            # Sensitive connection string from the Secret
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: fitness-secret
                  key: MONGODB_URI
            {{- if .Values.datadog.enabled }}
            # Datadog APM (tracing)
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: {{ .Values.datadog.traceAgentPort | quote }}
            - name: DD_ENV
              value: {{ .Values.datadog.env | quote }}
            - name: DD_SERVICE
              value: {{ .Values.datadog.service | quote }}
            - name: DD_VERSION
              value: {{ .Values.datadog.version | quote }}
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.service.name }}
  labels:
    app: {{ .Values.app.name }}
    {{- include "fitness-tracker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  selector:
    app: {{ .Values.app.name }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.service.targetPort }}
