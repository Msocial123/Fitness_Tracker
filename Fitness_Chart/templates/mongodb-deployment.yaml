apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.mongodb.name }}
  labels:
    app: {{ .Values.mongodb.name }}
    {{- include "fitness-tracker.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.mongodb.service.name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.mongodb.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mongodb.name }}
    spec:
      containers:
        - name: {{ .Values.mongodb.name }}
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.mongodb.port }}
          volumeMounts:
            - name: mongodb-storage
              mountPath: {{ .Values.mongodb.persistence.mountPath }}
  {{- if .Values.mongodb.persistence.enabled }}
  # EBS-backed PVC per pod => data survives pod/node failure (Phase 8).
  volumeClaimTemplates:
    - metadata:
        name: mongodb-storage
      spec:
        accessModes:
          - {{ .Values.mongodb.persistence.accessMode }}
        storageClassName: {{ .Values.mongodb.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.mongodb.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mongodb.service.name }}
  labels:
    app: {{ .Values.mongodb.name }}
    {{- include "fitness-tracker.labels" . | nindent 4 }}
spec:
  clusterIP: None   # headless service for the StatefulSet
  selector:
    app: {{ .Values.mongodb.name }}
  ports:
    - port: {{ .Values.mongodb.port }}
      targetPort: {{ .Values.mongodb.port }}
