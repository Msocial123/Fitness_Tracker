apiVersion: v1
kind: Secret
metadata:
  name: fitness-secret
  labels:
    app: {{ .Values.app.name }}
    {{- include "fitness-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Built from values so there is no drift between the URI and the DB service.
  MONGODB_URI: "mongodb://{{ .Values.mongodb.service.name }}:{{ .Values.mongodb.port }}/{{ .Values.mongodb.database }}"
