apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-tracker-app
  labels:
    app: fitness-tracker-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness-tracker-app
  template:
    metadata:
      labels:
        app: fitness-tracker-app
      annotations:
        ad.datadoghq.com/fitness-tracker-app.logs: >-
          [{"source":"nodejs","service":"fitness-tracker-service"},
           {"source":"nodejs","service":"fitness-tracker-app"}]
    spec:
      containers:
        - name: fitness-tracker-app
          # Your own image (built & pushed to your Docker Hub account)
          image: nanineelapu/fitness-tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            # --- Non-sensitive config comes from the ConfigMap ---
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: fitness-configmap
                  key: PORT
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: fitness-configmap
                  key: HOST
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: fitness-configmap
                  key: NODE_ENV
            # --- Sensitive connection string comes from the Secret ---
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: fitness-secret
                  key: MONGODB_URI
            # --- Datadog APM (tracing) ---
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
            - name: DD_ENV
              value: "production"
            - name: DD_SERVICE
              value: "fitness-tracker-app"
            - name: DD_VERSION
              value: "1.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: fitness-tracker-service
  labels:
    app: fitness-tracker-app
spec:
  selector:
    app: fitness-tracker-app
  ports:
    - port: 80
      targetPort: 5000
  type: LoadBalancer
