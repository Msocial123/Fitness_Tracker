apiVersion: v1
kind: Secret
metadata:
  name: fitness-secret
  labels:
    app: fitness-tracker-app
type: Opaque
# stringData lets you write plain text; Kubernetes base64-encodes it for you.
stringData:
  # Sensitive: DB connection string (may carry credentials in real setups).
  MONGODB_URI: "mongodb://mongodb-service:27017/fitness-tracker"
